<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>GE STARR Design</title>
  <meta name="description" content="GE STARR Design: design and edit sheet-metal and fabricated parts for GE STARR Engineering.">
  <meta name="robots" content="noindex">
  <link data-trunk rel="rust" data-bin="solidcraft-web" data-wasm-opt="z" data-weak-refs />
  <link data-trunk rel="copy-file" href="../../assets/fonts/biz-udp-gothic/BIZUDPGothic-Regular.ttf" data-target-path="fonts" />
  <link data-trunk rel="copy-file" href="../../assets/fonts/biz-udp-gothic/OFL.txt" data-target-path="fonts" />
  <link data-trunk rel="copy-file" href="../../assets/fonts/craft-ui-sc/CraftUI-SC.otf" data-target-path="fonts" />
  <link data-trunk rel="copy-file" href="../../assets/fonts/craft-ui-sc/OFL.txt" data-target-path="fonts/craft-ui-sc" />
  <link data-trunk rel="copy-file" href="../../assets/fonts/craft-ui-tc/CraftUI-TC.otf" data-target-path="fonts" />
  <link data-trunk rel="copy-file" href="../../assets/fonts/craft-ui-tc/OFL.txt" data-target-path="fonts/craft-ui-tc" />
  <link data-trunk rel="css" href="../../assets/styles/web/loading.css" />
  <link data-trunk rel="copy-file" href="../../gestarr/brand/loading-logo.svg" />
  <!-- Installable as an app (manifest.webmanifest); the icons are the Linux exports of the app mark. -->
  <meta name="theme-color" content="#2E3D4F">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="icons/32x32/mark-32.png">
  <link rel="apple-touch-icon" href="icons/256x256/mark-256.png">
  <link data-trunk rel="copy-file" href="manifest.webmanifest" />
  <link data-trunk rel="copy-file" href="channel-storage.txt" />
  <link data-trunk rel="copy-file" href="../../gestarr/brand/mark-32.png" data-target-path="icons/32x32" />
  <link data-trunk rel="copy-file" href="../../gestarr/brand/mark-256.png" data-target-path="icons/256x256" />
  <link data-trunk rel="copy-file" href="../../gestarr/brand/mark-512.png" data-target-path="icons/512x512" />
</head>
<body>
  <canvas id="solidcraft_canvas"></canvas>
  <div id="solidcraft_loading" role="status"><img src="loading-logo.svg" alt=""><span class="sr-only">Loading GE STARR Design&hellip;</span></div>
  <script>
    // Offline use and updates (sw.js; written into release builds by `cargo xtask web-offline`).
    if ("serviceWorker" in navigator) {
      // GE STARR Design: no offline service worker. TRACK serves the editor only to signed-in people, inside its
      // Design pages; a cached worker would serve it without asking. Remove any worker an earlier build installed.
      addEventListener("load", () => navigator.serviceWorker.getRegistrations().then((rs) => rs.forEach((r) => r.unregister())).catch(() => {}));
    }
    // Install as an app: the browser's offer can come before the app runs, so it is kept here for
    // the app's File ▸ Install app… item (src/install.rs). Installed, the browser makes no more offers.
    addEventListener("beforeinstallprompt", (e) => { e.preventDefault(); window.solidcraftInstall = e; });
    addEventListener("appinstalled", () => { window.solidcraftInstall = null; });
  </script>
</body>
</html>
